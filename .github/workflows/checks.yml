name: Fixture checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python tracecheck.py
      - run: python -m unittest discover -s tests -v
      - name: Reconcile published pilot evidence
        run: python pilots/trace-container-v1/verify_results.py pilots/trace-container-v1/results/2026-10-23
      - name: Verify deterministic generation
        run: |
          python build_fixtures.py
          git diff --exit-code -- fixtures manifest.json

      - name: Check out pinned Sentinel consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shawdaimarie/sentinel
          ref: 3b2e7cf0716e3940ef5f8af7beb0177408afe333
          path: .consumer
          persist-credentials: false
      - run: python -m pip install -r integration/requirements.lock
      - name: Real consumer integration and failure tests
        env:
          SENTINEL_CHECKOUT: ${{ github.workspace }}/.consumer
        run: |
          python -m unittest discover -s tests -v
          python integration/run.py --sentinel .consumer --output /tmp/trace-integration-ci
          python -O integration/verify.py /tmp/trace-integration-ci --sentinel .consumer
          python integration/build_cases.py
          git diff --exit-code -- integration/cases.json
      - name: Replay frozen historical baseline with Git provenance
        run: python pilots/trace-container-v1/run.py --protocol-commit 906d40859e2e846eac2e892924adaec2459d89f3 --output /tmp/trace-container-ci
