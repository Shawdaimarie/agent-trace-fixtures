name: Fixture checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python tracecheck.py --json-out reports/fixture-results.json
      - run: python -m unittest discover -s tests -v
      - name: Verify deterministic generation
        run: |
          python build_fixtures.py
          git diff --exit-code -- fixtures manifest.json
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixture-results-python-${{ matrix.python }}
          path: reports/fixture-results.json
          if-no-files-found: warn
