name: Fixture checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python tracecheck.py
      - run: python -m unittest discover -s tests -v
      - name: Reconcile published pilot evidence
        run: python pilots/trace-container-v1/verify_results.py pilots/trace-container-v1/results/2026-10-23
      - name: Verify deterministic generation
        run: |
          python build_fixtures.py
          git diff --exit-code -- fixtures manifest.json
